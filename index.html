<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>FVS OBRAS - TERGOS — Controle de Qualidade</title>
<style>
  :root{
    --bg:#f7f5f0; --card:#fff; --text:#38384a; --muted:#878791; --border:#e6e2d6;
    --primary:#38384a; --primary-dark:#24232f;
    --accent:#e5736e; --accent-dark:#c85850;
    --ok:#16a34a; --ok-bg:#e8f8ee;
    --nc:#dc2626; --nc-bg:#fdeceb;
    --na:#9ca3af; --na-bg:#f0f1f3;
    --pend:#d97706; --pend-bg:#fef3e2;
    --parcial:#0891b2; --parcial-bg:#e0f4f8;
    --chart-good:#0ca30c; --chart-warning:#fab219; --chart-critical:#d03b3b;
    --chart-seq:#38384a; --chart-seq-light:#dfdee6;
    --chart-grid:#e1e0d9; --chart-muted:#898781;
    --accent-tint:rgba(229,115,110,.10);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1f1e2b; --card:#28273a; --text:#ebe3d1; --muted:#a19fa8; --border:#3c3b4f;
      --primary:#4a4a60; --primary-dark:#5c5c78;
      --ok-bg:#0f2a1a; --nc-bg:#301412; --na-bg:#20242a; --pend-bg:#332107; --parcial-bg:#0d3540;
      --chart-seq:#9a9ab5; --chart-seq-light:#3a3950;
      --chart-grid:#2c2c2a; --chart-muted:#898781;
      --accent-tint:rgba(229,115,110,.18); }
  }
  *{box-sizing:border-box;}
  .ic{vertical-align:-0.18em;flex-shrink:0;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #app{max-width:900px;margin:0 auto;min-height:100vh;padding-bottom:80px;}
  header.top{position:sticky;top:0;background:var(--primary);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.15);}
  header.top button.back{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:0 6px;line-height:1;}
  header.top h1{font-size:17px;margin:0;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  header.top.logo-header{background:var(--card);border-bottom:1px solid var(--border);}
  header.top.logo-header button.back{color:var(--text);}
  header.top.logo-header .logo-img{height:30px;flex:1;object-fit:contain;object-position:left center;}
  main{padding:14px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
  .list-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:background .1s;}
  .list-item:active{background:var(--bg);}
  .list-item.selecionado{border-color:var(--accent);background:var(--accent-tint);}
  .list-item .icon{width:34px;height:34px;border-radius:8px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;position:relative;background-size:cover;background-position:center;}
  .list-item .icon.editable{cursor:pointer;}
  .list-item .icon .edit-badge{position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:9px;}
  .list-item .info{flex:1;min-width:0;}
  .list-item .info .title{font-weight:600;font-size:15px;}
  .list-item .info .sub{font-size:13px;color:var(--muted);margin-top:2px;}
  .list-item .chevron{color:var(--muted);font-size:18px;}
  .progress-bar{height:8px;border-radius:4px;background:var(--border);overflow:hidden;margin-top:6px;}
  .progress-bar > div{height:100%;background:var(--primary);border-radius:4px;transition:width .2s;}
  .badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;}
  .badge.ok{color:var(--ok);background:var(--ok-bg);}
  .badge.nc{color:var(--nc);background:var(--nc-bg);}
  .badge.na{color:var(--na);background:var(--na-bg);}
  .badge.pend{color:var(--pend);background:var(--pend-bg);}
  .fab{position:fixed;right:20px;bottom:24px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:28px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:20;}
  .fab:active{background:var(--accent-dark);}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:15px;font-family:inherit;margin-top:4px;}
  label{font-size:13px;color:var(--muted);font-weight:600;display:block;margin-top:12px;}
  .btn{display:inline-block;padding:11px 18px;border-radius:8px;border:none;font-size:15px;font-weight:600;cursor:pointer;}
  .btn.primary{background:var(--primary);color:#fff;width:100%;margin-top:16px;}
  .btn.primary:active{background:var(--primary-dark);}
  .btn.ghost{background:none;color:var(--nc);border:1px solid var(--nc);width:100%;margin-top:8px;}
  .empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:flex;align-items:flex-end;justify-content:center;}
  .modal{background:var(--card);width:100%;max-width:900px;border-radius:16px 16px 0 0;padding:20px;max-height:90vh;overflow-y:auto;}
  .modal h2{margin-top:0;font-size:18px;}
  .checklist-item{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;}
  .checklist-item .txt{font-size:14.5px;margin-bottom:8px;}
  .item-status-badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:10px;margin-left:6px;vertical-align:middle;background:var(--pend-bg);color:var(--pend);}
  .item-status-badge.ok{background:var(--ok-bg);color:var(--ok);}
  .item-status-badge.nc{background:var(--nc-bg);color:var(--nc);}
  .item-status-badge.na{background:var(--na-bg);color:var(--na);}
  .item-status-badge.parcial{background:var(--parcial-bg);color:var(--parcial);}
  .sub-checks{display:flex;flex-direction:column;gap:10px;margin-bottom:4px;}
  .sub-check-row{font-size:13px;}
  .sub-check-row .sub-check-txt{display:block;margin-bottom:5px;}
  .sub-check-row.disabled{opacity:.45;}
  .sub-check-row .status-row-icons{gap:4px;}
  .sub-check-row .status-icon-btn{font-size:14px;padding:5px 2px;}
  .status-row-icons{display:flex;gap:6px;}
  .status-icon-btn{flex:1;padding:8px 4px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-size:19px;line-height:1;cursor:pointer;opacity:.55;}
  .status-icon-btn.sel-ok{background:var(--ok-bg);border-color:var(--ok);opacity:1;}
  .status-icon-btn.sel-nc{background:var(--nc-bg);border-color:var(--nc);opacity:1;}
  .status-icon-btn.sel-na{background:var(--na-bg);border-color:var(--na);opacity:1;}
  .status-icon-btn.sel-parcial{background:var(--parcial-bg);border-color:var(--parcial);opacity:1;}
  .status-icon-btn.sel-pend{background:var(--pend-bg);border-color:var(--pend);opacity:1;}
  .status-icon-btn:disabled{cursor:default;}
  .na-btn{padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;}
  .na-btn.active{background:var(--na);color:#fff;border-color:var(--na);}
  .reorder-btn{width:34px;height:24px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:12px;cursor:pointer;flex-shrink:0;}
  .reorder-btn:disabled{opacity:.3;cursor:default;}
  .item-extra{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .item-extra textarea{min-height:36px;font-size:13px;}
  .photo-thumb{width:52px;height:52px;border-radius:6px;object-fit:cover;border:1px solid var(--border);}
  .photo-btn{width:52px;height:52px;border-radius:6px;border:1px dashed var(--border);background:none;color:var(--muted);font-size:20px;cursor:pointer;flex-shrink:0;}
  .save-bar{position:sticky;bottom:-20px;background:var(--card);margin:16px -20px -20px;padding:12px 20px;border-top:1px solid var(--border);}
  .btn.save-pending{background:var(--nc);}
  .btn.save-ok{background:var(--ok);}
  .normas-box{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--muted);margin-bottom:12px;}
  .normas-box b{color:var(--text);}
  .tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;}
  .tab{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;color:var(--muted);}
  .tab.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .search-box{margin-bottom:10px;}
  .stat-row{display:flex;gap:8px;margin-bottom:14px;}
  .stat{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center;}
  .stat .num{font-size:20px;font-weight:700;}
  .stat .lbl{font-size:11px;color:var(--muted);margin-top:2px;}
  .stat-cards-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .stat-card{flex:1 1 190px;min-width:190px;border-radius:10px;padding:12px 14px;color:#fff;}
  .stat-card.c-gray{background:#6b6a78;}
  .stat-card.c-green{background:var(--ok);}
  .stat-card.c-orange{background:var(--pend);}
  .stat-card.c-red{background:var(--nc);}
  .stat-card .nums{display:flex;gap:10px;}
  .stat-card .nums > div{flex:1;min-width:0;}
  .stat-card .nums > div:last-child{text-align:right;}
  .stat-card .nums .num{font-size:19px;font-weight:700;line-height:1.1;}
  .stat-card .nums .sub-lbl{font-size:10.5px;opacity:.9;margin-top:2px;}
  .stat-card .pct-pill{display:inline-block;max-width:100%;margin-top:6px;padding:2px 7px;border-radius:8px;background:rgba(255,255,255,.22);font-size:10.5px;font-weight:700;line-height:1.35;white-space:normal;}
  .stat-card .cat-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;opacity:.9;margin-top:10px;}
  .close-x{background:none;border:none;color:var(--muted);font-size:22px;float:right;cursor:pointer;line-height:1;}

  #print-area{display:none;}
  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{display:block;position:absolute;top:0;left:0;width:100%;padding:0;margin:0;color:#000;background:#fff;}
    .fab, header.top, .modal-bg{display:none !important;}
  }
  .rel-header{border-bottom:2px solid #222;padding-bottom:10px;margin-bottom:16px;}
  .rel-header h1{font-size:20px;margin:0 0 4px 0;}
  .rel-header .meta{font-size:12px;color:#444;}
  .rel-fvs-bloco{margin-bottom:22px;page-break-inside:avoid;}
  .rel-fvs-bloco h2{font-size:15px;background:#eee;padding:6px 10px;margin:0 0 8px 0;border-radius:4px;}
  .rel-normas{font-size:11px;color:#444;margin-bottom:8px;}
  .rel-item{border:1px solid #ccc;border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:12.5px;page-break-inside:avoid;}
  .rel-item .rel-status{font-weight:700;padding:1px 8px;border-radius:10px;font-size:11px;display:inline-block;margin-left:6px;}
  .rel-item .rel-status.ok{background:#e8f8ee;color:#16a34a;}
  .rel-item .rel-status.nc{background:#fdeceb;color:#dc2626;}
  .rel-item .rel-status.na{background:#f0f1f3;color:#666;}
  .rel-item .rel-status.pend{background:#fef3e2;color:#b45309;}
  .rel-item .rel-status.parcial{background:#e0f4f8;color:#0891b2;}
  .rel-item .rel-obs{color:#444;margin-top:4px;}
  .rel-item .rel-foto{max-width:160px;max-height:160px;display:block;margin-top:6px;border:1px solid #ccc;}
  .rel-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:16px;}
  .rel-table th, .rel-table td{border:1px solid #ccc;padding:6px 8px;text-align:left;}
  .rel-table th{background:#eee;}
  .rel-resumo-cards{display:flex;gap:10px;margin-bottom:18px;}
  .rel-resumo-cards div{flex:1;border:1px solid #ccc;border-radius:6px;padding:10px;text-align:center;}
  .rel-resumo-cards .n{font-size:20px;font-weight:700;display:block;}

  .chart-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
  .charts-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;}
  .charts-row .chart-card{flex:1;min-width:210px;margin-bottom:10px;}
  .chart-card h3{margin:0 0 8px 0;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.02em;}
  .chart-legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:11px;color:var(--text);}
  .chart-legend .lg{display:flex;align-items:center;gap:5px;}
  .chart-legend .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .bar-row .lbl{width:150px;flex-shrink:0;font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar-row .track{flex:1;height:14px;border-radius:4px;background:var(--chart-seq-light);overflow:hidden;}
  .bar-row .fill{height:100%;background:var(--chart-seq);border-radius:4px;}
  .bar-row .val{width:36px;flex-shrink:0;text-align:right;font-size:12.5px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;}

  .import-item{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
  .import-item .linha1{display:flex;align-items:center;gap:8px;}
  .import-item .linha1 input[type=checkbox]{width:18px;height:18px;flex-shrink:0;}
  .import-item .linha1 input[type=text]{margin-top:0;}
  .import-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .import-chip{font-size:12px;padding:5px 10px;border-radius:16px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;}
  .import-chip.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .import-grupo{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
  .import-grupo-header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bg);}
  .import-grupo-header input[type=checkbox]{width:18px;height:18px;flex-shrink:0;}
  .import-grupo-header input[type=text]{margin-top:0;flex:1;font-weight:600;}
  .import-grupo-info{font-size:11px;color:var(--muted);white-space:nowrap;flex-shrink:0;}
  .import-grupo-corpo{padding:10px 12px;}
  .import-subtitulo{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.02em;margin:10px 0 6px;}
  .import-select-unid{width:auto;margin-top:0;font-size:12px;padding:4px 6px;flex-shrink:0;}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "web-ifc": "https://cdn.jsdelivr.net/npm/web-ifc@0.0.77/web-ifc-api.js"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="print-area"></div>

<script src="scripts/catalogo-fvs.js"></script>
<script src="scripts/subchecks-fvs.js"></script>
<script src="scripts/nomes-comodo.js"></script>
<script>
// ---------- ÍCONES (traço fino, minimalista, cor herdada via currentColor) ----------
const ICON_PATHS = {
  crane: `<path d="M5 21h7M8 21V3M8 6l11 3M8 9l8 2.2M17 8v4M15.5 12.5c0 1 .8 1.5 1.5 1.5"/>`,
  building: `<rect x="4" y="10" width="7" height="11"/><rect x="13" y="4" width="7" height="17"/><path d="M6.5 13h1M6.5 16h1M6.5 19h1M15.5 7h1M15.5 10h1M15.5 13h1M15.5 16h1"/>`,
  door: `<rect x="6" y="3" width="12" height="18" rx="1"/><path d="M9 3v18"/><circle cx="14.3" cy="12" r=".7" fill="currentColor" stroke="none"/>`,
  clipboard: `<rect x="5" y="4" width="14" height="17" rx="1.5"/><rect x="8.5" y="2.3" width="7" height="3" rx="1"/><path d="M8 10.5h8M8 14h8M8 17.5h5"/>`,
  key: `<circle cx="8" cy="8" r="4"/><path d="M11 11l9 9M17 14l2.5 2.5M14.5 16.5L17 19"/>`,
  worker: `<path d="M12 3a5 5 0 0 1 5 5H7a5 5 0 0 1 5-5z"/><path d="M6 8h12"/><circle cx="12" cy="13.3" r="2.3"/><path d="M6 21v-2a6 6 0 0 1 12 0v2"/>`,
  floppy: `<path d="M5 4h11l3 3v13H5z"/><rect x="8" y="4" width="7" height="5"/><rect x="7" y="13" width="10" height="7"/>`,
  restore: `<path d="M12 3v10M8.5 9.5 12 13l3.5-3.5"/><path d="M4 14v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/>`,
  document: `<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M9.5 12h5.5M9.5 15.5h5.5"/>`,
  pencil: `<path d="M4 20l1-4.2L15.8 5 19 8.2 8.2 19z"/><path d="M13.5 6.5 17.5 10.5"/>`,
  trash: `<path d="M5 7h14M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M7 7l1 13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-13"/><path d="M10 11v6M14 11v6"/>`,
  camera: `<path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.2"/>`,
  ruler: `<path d="M4 20 20 20 20 4z"/><path d="M8 20v-3M12 20v-5M16 20v-7"/>`,
  updown: `<path d="M12 3v18M8 7l4-4 4 4M8 17l4 4 4-4"/>`,
  up: `<path d="M6 15l6-6 6 6"/>`,
  down: `<path d="M6 9l6 6 6-6"/>`,
  check: `<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/>`,
  thumbup: `<path d="M7 21V11h2l4-7 1.5 1v6H18a2 2 0 0 1 1.9 2.6l-1.7 6A2 2 0 0 1 16.3 21H9"/><path d="M7 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h2"/>`,
  thumbdown: `<path d="M17 3v10h-2l-4 7-1.5-1v-6H6a2 2 0 0 1-1.9-2.6l1.7-6A2 2 0 0 1 7.7 3H15"/><path d="M17 13h2a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1h-2"/>`,
  bubble: `<path d="M4 5h16v11H9l-4 4v-4H4z"/><path d="M8 9h8M8 12.5h5"/>`,
  ban: `<circle cx="12" cy="12" r="9"/><path d="M6 6l12 12"/>`,
  hourglass: `<path d="M6 3h12M6 21h12M7 3c0 5 5 6 5 9s-5 4-5 9M17 3c0 5-5 6-5 9s5 4 5 9"/>`,
  back: `<path d="M19 12H5M11 6l-6 6 6 6"/>`,
  chevron: `<path d="M9 6l6 6-6 6"/>`
};
function icon(name){
  return `<svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[name]||""}</svg>`;
}

const STORAGE_KEY = "qualitab_obra_v1";

function loadDB(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { obras: [] }; }
  catch(e){ return { obras: [] }; }
}
function saveDB(db){ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

var db = loadDB();
var route = { view: "obras" };
var pavimentosReordenando = false;

function go(newRoute){ route = newRoute; render(); }

function getObra(id){ return db.obras.find(o=>o.id===id); }
function getPav(obra,id){ return obra.pavimentos.find(p=>p.id===id); }
function getUnid(pav,id){ return pav.unidades.find(u=>u.id===id); }
function getAmb(pav,id){ return pav.ambientes.find(a=>a.id===id); }
function getFvsInst(amb,id){ return amb.fvsList.find(f=>f.instId===id); }

function todosAmbientesDoPavimento(pav){
  if(!pav.unidades) pav.unidades = [];
  return pav.ambientes.concat(pav.unidades.flatMap(u=>u.ambientes));
}
function todosAmbientesDaObra(obra){
  return obra.pavimentos.flatMap(pav=>todosAmbientesDoPavimento(pav));
}
// Como todosAmbientesDaObra, mas preservando pavimento/unidade/ambiente de cada FVS aplicada
// (necessário pra rastrear qual fornecedor/encarregado é responsável por qual serviço, onde).
function todasFvsComContexto(obra){
  const out = [];
  obra.pavimentos.forEach(pav=>{
    if(!pav.unidades) pav.unidades = [];
    pav.ambientes.forEach(amb=>amb.fvsList.forEach(fvsInst=>out.push({pav, unid:null, amb, fvsInst})));
    pav.unidades.forEach(unid=>unid.ambientes.forEach(amb=>amb.fvsList.forEach(fvsInst=>out.push({pav, unid, amb, fvsInst}))));
  });
  return out;
}

function fornecedoresDaObra(obra){
  if(!obra.fornecedores) obra.fornecedores = [];
  return obra.fornecedores;
}
function getFornecedor(obra, id){ return fornecedoresDaObra(obra).find(f=>f.id===id); }

function statusDeItem(item){ return item.status || "pend"; }

function subChecksDoItem(codigo, rev, textoItem){
  const grupo = window.FVS_SUBCHECKS && window.FVS_SUBCHECKS[codigo+"|"+rev];
  return (grupo && grupo[textoItem]) || [];
}

function legendaStatusItem(item){
  if(item.status==="ok") return "Conforme";
  if(item.status==="nc") return "Não conf.";
  if(item.status==="parcial") return "Parcial";
  if(item.status==="na") return "N/A";
  return "Pendente";
}

const OBS_AUTO_MARCADOR = "🔧 Pendente:";
function atualizarObsAutomatica(item, pendentes){
  const obsAtual = item.obs || "";
  const linhas = obsAtual.split("\n");
  const primeiraEhAuto = linhas[0] && linhas[0].startsWith(OBS_AUTO_MARCADOR);
  const textoLivre = primeiraEhAuto ? linhas.slice(1).join("\n").replace(/^\n+/, "") : obsAtual;
  if(pendentes.length===0){
    item.obs = textoLivre;
  } else {
    const linhaAuto = OBS_AUTO_MARCADOR+" "+pendentes.join("; ");
    item.obs = textoLivre ? (linhaAuto+"\n\n"+textoLivre) : linhaAuto;
  }
}

function calcProgresso(itens){
  if(!itens.length) return 0;
  const feitos = itens.filter(i=> i.status==="ok" || i.status==="nc" || i.status==="parcial" || i.status==="na").length;
  return Math.round((feitos/itens.length)*100);
}
function calcProgressoFvsList(fvsList){
  if(!fvsList.length) return 0;
  const total = fvsList.reduce((s,f)=>s+f.itens.length,0);
  const feitos = fvsList.reduce((s,f)=>s+f.itens.filter(i=>i.status==="ok"||i.status==="nc"||i.status==="parcial"||i.status==="na").length,0);
  return total? Math.round((feitos/total)*100) : 0;
}
function contarNC(fvsList){
  return fvsList.reduce((s,f)=>s+f.itens.filter(i=>i.status==="nc").length,0);
}

// Status do item a partir do status de cada sub-check (ok/nc/parcial/na/pend):
// ignora sub-checks N/A; sem nenhum avaliado -> pendente; todos conformes -> ok;
// todos não conformes -> nc; qualquer mistura (inclusive parcialmente avaliado) -> parcial;
// só sub-checks N/A -> item também N/A.
function statusPorSubitens(subitens){
  const semNA = subitens.filter(s=>s.status!=='na');
  if(semNA.length===0) return "na";
  const avaliados = semNA.filter(s=>s.status && s.status!=='pend');
  if(avaliados.length===0) return "pend";
  if(avaliados.length===semNA.length && avaliados.every(s=>s.status==='ok')) return "ok";
  if(avaliados.length===semNA.length && avaliados.every(s=>s.status==='nc')) return "nc";
  return "parcial";
}
// Item não conforme ou parcialmente conforme gera necessidade de reinspeção.
function itemPrecisaReinspecao(item){
  return item.status==="nc" || item.status==="parcial";
}

// ---------- APROVAÇÃO E REINSPEÇÃO (por FVS aplicada) ----------
function fvsCompleto(fvsInst){ return calcProgresso(fvsInst.itens) === 100; }
function fvsTemNC(fvsInst){ return fvsInst.itens.some(i=>i.status==="nc"); }
function fvsAprovacao(fvsInst){
  if(!fvsInst.aprovacao) fvsInst.aprovacao = { status:"pendente", aprovadoEm:null };
  return fvsInst.aprovacao;
}
function fvsReinspecao(fvsInst){
  if(!fvsInst.reinspecao) fvsInst.reinspecao = { agendadaPara:null };
  return fvsInst.reinspecao;
}
// null | "a_aprovar" | "aprovado" — só se aplica quando a FVS está 100% verificada
function statusAprovacao(fvsInst){
  if(!fvsCompleto(fvsInst)) return null;
  return fvsAprovacao(fvsInst).status==="aprovado" ? "aprovado" : "a_aprovar";
}
// null | "nao_agendada" | "agendada" | "vencida" — só se aplica enquanto houver item não conforme ou parcialmente conforme
function statusReinspecao(fvsInst){
  if(!fvsInst.itens.some(itemPrecisaReinspecao)) return null;
  const agendadaPara = fvsReinspecao(fvsInst).agendadaPara;
  if(!agendadaPara) return "nao_agendada";
  const hoje = new Date().toISOString().slice(0,10);
  return agendadaPara < hoje ? "vencida" : "agendada";
}

function blocoAprovacaoReinspecao(fvsInst){
  const statusAprov = statusAprovacao(fvsInst); // null | "a_aprovar" | "aprovado"
  const statusReinsp = statusReinspecao(fvsInst); // null | "nao_agendada" | "agendada" | "vencida"
  if(!statusAprov && !statusReinsp) return "";

  let html = `<div class="card">`;
  if(statusAprov){
    const aprovado = statusAprov==="aprovado";
    html += `<div style="display:flex;align-items:center;justify-content:space-between;${statusReinsp?'margin-bottom:14px;':''}">
      <div>
        <div style="font-weight:600;font-size:14px;margin-bottom:4px;">Aprovação</div>
        <span class="badge ${aprovado?'ok':'pend'}">${aprovado?'✓ Aprovado':'Aguardando aprovação'}</span>
      </div>
      <button class="btn ${aprovado?'':'primary'}" style="width:auto;margin:0;padding:9px 14px;font-size:13px;${aprovado?'background:none;border:1px solid var(--border);color:var(--text);':''}" id="m-toggle-aprovacao">${aprovado?'Desfazer':icon('check')+' Aprovar'}</button>
    </div>`;
  }
  if(statusReinsp){
    const labelMap = { vencida:["Vencida","nc"], agendada:["Agendada","ok"], nao_agendada:["Não agendada","pend"] };
    const [lbl,cls] = labelMap[statusReinsp];
    const agendadaPara = fvsReinspecao(fvsInst).agendadaPara || "";
    html += `<div style="font-weight:600;font-size:14px;margin-bottom:8px;">Reinspeção <span class="badge ${cls}">${lbl}</span></div>
      <label style="margin-top:0;">Data agendada para reinspeção</label>
      <input type="date" id="m-data-reinsp" value="${agendadaPara}">`;
  }
  html += `</div>`;
  return html;
}

// ---------- GRÁFICOS (SVG puro, sem bibliotecas externas) ----------
function svgEl(tag, attrs){
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for(const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

function graficoRosca(okC, nc, pendC){
  const card = document.createElement("div");
  card.className="chart-card";
  const total = okC + nc + pendC;
  const h3 = document.createElement("h3"); h3.textContent="Distribuição geral dos itens";
  card.appendChild(h3);

  if(!total){
    const p = document.createElement("div"); p.className="empty"; p.style.padding="10px";
    p.textContent="Sem itens verificados ainda.";
    card.appendChild(p);
    return card;
  }

  const wrap = document.createElement("div");
  wrap.style.display="flex"; wrap.style.alignItems="center"; wrap.style.gap="12px"; wrap.style.flexWrap="wrap";

  const size=96, r=34, cx=size/2, cy=size/2, strokeW=14;
  const circunf = 2*Math.PI*r;
  const fatias = [
    {v:okC, cor:"var(--chart-good)", label:"Conforme"},
    {v:nc, cor:"var(--chart-critical)", label:"Não conforme"},
    {v:pendC, cor:"var(--chart-warning)", label:"Pendente"}
  ].filter(f=>f.v>0);

  const svg = svgEl("svg", {width:size, height:size, viewBox:`0 0 ${size} ${size}`, role:"img", "aria-label":"Distribuição de itens: conforme, não conforme e pendente"});
  const bg = svgEl("circle", {cx, cy, r, fill:"none", stroke:"var(--chart-grid)", "stroke-width":strokeW});
  svg.appendChild(bg);

  let acumulado = 0;
  fatias.forEach(f=>{
    const frac = f.v/total;
    const dash = frac*circunf;
    const gap = Math.max(circunf - dash - 2, 0); // 2px de separador entre fatias
    const offset = -acumulado*circunf - 1;
    const seg = svgEl("circle", {
      cx, cy, r, fill:"none", stroke:f.cor, "stroke-width":strokeW,
      "stroke-dasharray": `${Math.max(dash-2,0)} ${gap+2}`,
      "stroke-dashoffset": offset,
      transform: `rotate(-90 ${cx} ${cy})`
    });
    seg.setAttribute("stroke-linecap","round");
    svg.appendChild(seg);
    acumulado += frac;
  });

  const centroTxt = svgEl("text", {x:cx, y:cy-1, "text-anchor":"middle", "font-size":"15", "font-weight":"700", fill:"var(--text)"});
  centroTxt.textContent = Math.round((okC/total)*100)+"%";
  svg.appendChild(centroTxt);
  const centroLbl = svgEl("text", {x:cx, y:cy+11, "text-anchor":"middle", "font-size":"7.5", fill:"var(--chart-muted)"});
  centroLbl.textContent = "conforme";
  svg.appendChild(centroLbl);

  wrap.appendChild(svg);

  const legend = document.createElement("div");
  legend.className="chart-legend";
  legend.style.flexDirection="column";
  legend.style.gap="5px";
  [{v:okC,cor:"var(--chart-good)",label:"Conforme"},{v:nc,cor:"var(--chart-critical)",label:"Não conforme"},{v:pendC,cor:"var(--chart-warning)",label:"Pendente"}].forEach(f=>{
    const lg = document.createElement("div"); lg.className="lg";
    lg.innerHTML = `<span class="dot" style="background:${f.cor}"></span>${f.label}: <b>${f.v}</b> (${total?Math.round(f.v/total*100):0}%)`;
    legend.appendChild(lg);
  });
  wrap.appendChild(legend);
  card.appendChild(wrap);
  return card;
}

// ---------- MODELO 3D (IFC) — progresso da obra sobre a estrutura real ----------
const CDN_THREE_VERSION = "0.170.0";
const CDN_WEBIFC_VERSION = "0.0.77";
let _ifcLibsPromise = null;
function carregarLibsIFC(){
  if(_ifcLibsPromise) return _ifcLibsPromise;
  _ifcLibsPromise = Promise.all([
    import("three"),
    import("three/addons/controls/OrbitControls.js"),
    import("three/addons/utils/BufferGeometryUtils.js"),
    import("web-ifc")
  ]).then(([THREE, OrbitControlsMod, BufferGeometryUtils, WebIFC])=>({
    THREE, OrbitControls: OrbitControlsMod.OrbitControls, BufferGeometryUtils, WebIFC
  })).catch(err=>{ _ifcLibsPromise = null; throw err; });
  return _ifcLibsPromise;
}

const IFC_DB_NAME = "qualitab_obra_ifc";
const IFC_DB_STORE = "arquivos";
function abrirIfcDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(IFC_DB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IFC_DB_STORE); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function salvarIfcBytes(obraId, bytes){
  const dbIfc = await abrirIfcDB();
  return new Promise((resolve, reject)=>{
    const tx = dbIfc.transaction(IFC_DB_STORE, "readwrite");
    tx.objectStore(IFC_DB_STORE).put(bytes, obraId);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
async function carregarIfcBytes(obraId){
  const dbIfc = await abrirIfcDB();
  return new Promise((resolve, reject)=>{
    const tx = dbIfc.transaction(IFC_DB_STORE, "readonly");
    const req = tx.objectStore(IFC_DB_STORE).get(obraId);
    req.onsuccess = ()=>resolve(req.result || null);
    req.onerror = ()=>reject(req.error);
  });
}
async function limparIfcBytes(obraId){
  const dbIfc = await abrirIfcDB();
  return new Promise((resolve)=>{
    const tx = dbIfc.transaction(IFC_DB_STORE, "readwrite");
    tx.objectStore(IFC_DB_STORE).delete(obraId);
    tx.oncomplete = ()=>resolve();
  });
}

function normalizarParaComparacaoIFC(s){
  const semAcento = (s||"").toUpperCase().normalize("NFD");
  let out = "";
  for(const ch of semAcento){
    const code = ch.codePointAt(0);
    if(code >= 0x300 && code <= 0x36f) continue; // remove marcas diacríticas
    if(/[A-Z0-9]/.test(ch)) out += ch; // só letras/números, ignora espaços, º/°, barras etc.
  }
  return out;
}
function melhorPavimentoParaNome(obra, nomeIFC){
  const alvo = normalizarParaComparacaoIFC(nomeIFC);
  let melhor = null, melhorScore = 0;
  obra.pavimentos.forEach(pav=>{
    const cand = normalizarParaComparacaoIFC(pav.nome);
    if(!cand || !alvo) return;
    let score = 0;
    if(alvo.includes(cand) || cand.includes(alvo)) score = Math.min(cand.length, alvo.length);
    if(score > melhorScore){ melhorScore = score; melhor = pav; }
  });
  return melhorScore >= 3 ? melhor : null;
}

// Cor por pavimento, alinhada com os status já usados no resto do app.
function corPavimentoIFC(pav){
  if(!pav) return [0.75,0.75,0.76];
  const itens = todosAmbientesDoPavimento(pav).flatMap(a=>a.fvsList).flatMap(f=>f.itens);
  if(!itens.length) return [0.75,0.75,0.76];
  if(itens.some(i=>i.status==="nc")) return hexToRgb01("#dc2626");
  if(calcProgresso(itens)>=100) return hexToRgb01("#16a34a");
  return hexToRgb01("#d97706");
}
function hexToRgb01(hex){
  const n = parseInt(hex.slice(1),16);
  return [((n>>16)&255)/255, ((n>>8)&255)/255, (n&255)/255];
}

function cardModelo3D(obra){

function renderPromptImportarIFC(body, obra){
  body.innerHTML = `
    <p style="font-size:13px;color:var(--muted);margin:0 0 10px;">Importe o modelo 3D (arquivo .ifc) da obra para visualizar o progresso das verificações sobre a estrutura real do prédio.</p>

  `;

    status.textContent = "Lendo arquivo...";

      await salvarIfcBytes(obra.id, bytes);
      renderVisualizador3D(body, obra, bytes);
    }catch(e){
      status.textContent = "Não consegui ler esse arquivo.";

async function renderVisualizador3D(body, obra, bytes){
  body.innerHTML = `<div style="font-size:13px;color:var(--muted);padding:20px 0;text-align:center;">Carregando modelo 3D...</div>`;
  let libs;
  try{
    libs = await carregarLibsIFC();
  }catch(e){
    body.innerHTML = `<div class="empty">Não consegui carregar as bibliotecas de visualização 3D (verifique sua internet).</div>`;
    return;
  }
  const { WebIFC } = libs;
  const ifcAPI = new WebIFC.IfcAPI();
  ifcAPI.SetWasmPath(`https://cdn.jsdelivr.net/npm/web-ifc@${CDN_WEBIFC_VERSION}/`);
  await ifcAPI.Init();

  let modelID;
  try{
    modelID = ifcAPI.OpenModel(bytes, { COORDINATE_TO_ORIGIN: true });
  }catch(e){
    body.innerHTML = `<div class="empty">Não consegui interpretar esse arquivo IFC.</div>`;
    return;
  }

  const storeyIDs = ifcAPI.GetLineIDsWithType(modelID, WebIFC.IFCBUILDINGSTOREY);
  const storeys = [];
  for(let i=0;i<storeyIDs.size();i++){
    const id = storeyIDs.get(i);
    const line = ifcAPI.GetLine(modelID, id);
    storeys.push({ expressID:id, nome: (line.Name && line.Name.value) ? line.Name.value : ("Pavimento "+id) });
  }

  const elementoParaStorey = {};
  const relIDs = ifcAPI.GetLineIDsWithType(modelID, WebIFC.IFCRELCONTAINEDINSPATIALSTRUCTURE);
  for(let i=0;i<relIDs.size();i++){
    const rel = ifcAPI.GetLine(modelID, relIDs.get(i));
    const storeyID = rel.RelatingStructure && rel.RelatingStructure.value;
    if(storeyID==null) continue;
    (rel.RelatedElements||[]).forEach(item=>{ elementoParaStorey[item.value] = storeyID; });
  }

  const mapaSalvo = obra.ifcStoreyMap || null;
  const pareamento = storeys.map(st=>{
    if(mapaSalvo && mapaSalvo[st.nome] !== undefined) return { ...st, pavimentoId: mapaSalvo[st.nome] };
    const auto = melhorPavimentoParaNome(obra, st.nome);
    return { ...st, pavimentoId: auto ? auto.id : "" };
  });

  if(!mapaSalvo){
    abrirRevisaoParesIFC(body, obra, storeys, pareamento, elementoParaStorey, ifcAPI, modelID, libs);
    return;
  }
  renderizarCena3D(body, obra, pareamento, elementoParaStorey, ifcAPI, modelID, libs);
}

function abrirRevisaoParesIFC(body, obra, storeys, pareamento, elementoParaStorey, ifcAPI, modelID, libs){

  body.innerHTML = `
    <p style="font-size:13px;color:var(--muted);margin:0 0 10px;">Confira o pareamento entre os pavimentos do IFC e os pavimentos já cadastrados nesta obra:</p>
    <div class="ifc-pares"></div>

  `;

  paresDiv.innerHTML = pareamento.map((st,idx)=>`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
      <div style="flex:1;font-size:12.5px;" title="${escapeHtml(st.nome)}">${escapeHtml(st.nome)}</div>
      <select data-idx="${idx}" style="flex:1;margin-top:0;">

  paresDiv.querySelectorAll("select").forEach(sel=>{

  });

    const mapa = {};
    pareamento.forEach(st=>{ mapa[st.nome] = st.pavimentoId || ""; });
    obra.ifcStoreyMap = mapa;
    saveDB(db);
    renderizarCena3D(body, obra, pareamento, elementoParaStorey, ifcAPI, modelID, libs);
  };
}

function renderizarCena3D(body, obra, pareamento, elementoParaStorey, ifcAPI, modelID, libs){
  const {THREE, OrbitControls, BufferGeometryUtils} = libs;
  const storeyPorID = {};
  pareamento.forEach(st=>{ storeyPorID[st.expressID] = st; });

  body.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px;">
      <div class="chart-legend" style="margin-top:0;">
        <div class="lg"><span class="dot" style="background:#16a34a"></span>Completo</div>
        <div class="lg"><span class="dot" style="background:#d97706"></span>Em andamento</div>
        <div class="lg"><span class="dot" style="background:#dc2626"></span>Com NC</div>
        <div class="lg"><span class="dot" style="background:#bfbfc4"></span>Sem dado</div>
      </div>
      <button class="btn ifc-trocar" style="width:auto;margin:0;padding:6px 10px;font-size:12px;border:1px solid var(--border);background:none;color:var(--text);">Trocar modelo</button>
    </div>
    <div class="ifc-canvas-wrap" style="position:relative;width:100%;height:340px;border-radius:8px;overflow:hidden;background:#dfe0e6;"></div>
  `;
  body.querySelector(".ifc-trocar").onclick=()=>{
    obra.ifcStoreyMap = null; saveDB(db);
    limparIfcBytes(obra.id);
    renderPromptImportarIFC(body, obra);
  };

  const wrap = body.querySelector(".ifc-canvas-wrap");
  const w = wrap.clientWidth || 300, h = wrap.clientHeight || 340;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xdfe0e6);
  const camera = new THREE.PerspectiveCamera(45, w/h, 0.1, 2000);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(w,h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  wrap.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.9));
  const dl = new THREE.DirectionalLight(0xffffff, 1.2);
  dl.position.set(1,1,1);
  scene.add(dl);

  const geometrias = [];
  ifcAPI.StreamAllMeshes(modelID, (flatMesh)=>{
    const storeyID = elementoParaStorey[flatMesh.expressID];
    const st = storeyID!=null ? storeyPorID[storeyID] : null;
    const pav = st && st.pavimentoId ? getPav(obra, st.pavimentoId) : null;
    const corRGB = corPavimentoIFC(pav);
    const placedGeometries = flatMesh.geometries;
    for(let i=0;i<placedGeometries.size();i++){
      const pg = placedGeometries.get(i);
      const geometry = ifcAPI.GetGeometry(modelID, pg.geometryExpressID);
      const vertexData = ifcAPI.GetVertexArray(geometry.GetVertexData(), geometry.GetVertexDataSize());
      const indexData = ifcAPI.GetIndexArray(geometry.GetIndexData(), geometry.GetIndexDataSize());
      geometry.delete();
      const vertexCount = vertexData.length/6;
      const positions = new Float32Array(vertexCount*3);
      const normals = new Float32Array(vertexCount*3);
      const colors = new Float32Array(vertexCount*3);
      for(let v=0; v<vertexCount; v++){
        const src=v*6, d3=v*3;
        positions[d3]=vertexData[src]; positions[d3+1]=vertexData[src+1]; positions[d3+2]=vertexData[src+2];
        normals[d3]=vertexData[src+3]; normals[d3+1]=vertexData[src+4]; normals[d3+2]=vertexData[src+5];
        colors[d3]=corRGB[0]; colors[d3+1]=corRGB[1]; colors[d3+2]=corRGB[2];
      }
      const buffGeo = new THREE.BufferGeometry();
      buffGeo.setAttribute('position', new THREE.BufferAttribute(positions,3));
      buffGeo.setAttribute('normal', new THREE.BufferAttribute(normals,3));
      buffGeo.setAttribute('color', new THREE.BufferAttribute(colors,3));
      buffGeo.setIndex(new THREE.BufferAttribute(indexData,1));
      buffGeo.applyMatrix4(new THREE.Matrix4().fromArray(pg.flatTransformation));
      geometrias.push(buffGeo);
    }
  });
  ifcAPI.CloseModel(modelID);

  if(!geometrias.length){
    wrap.innerHTML = '<div class="empty" style="padding:60px 20px;">Nenhuma geometria encontrada nesse arquivo.</div>';
    return;
  }

  const merged = BufferGeometryUtils.mergeGeometries(geometrias);
  merged.computeBoundingSphere();
  const mat = new THREE.MeshLambertMaterial({vertexColors:true, side:THREE.DoubleSide});
  scene.add(new THREE.Mesh(merged, mat));

  const sphere = merged.boundingSphere;
  const dist = sphere.radius * 2.4;
  camera.position.set(sphere.center.x+dist, sphere.center.y+dist*0.6, sphere.center.z+dist);
  camera.lookAt(sphere.center);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.copy(sphere.center);
  controls.update();

  (function animate(){
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  })();
}

function graficoRankingFvsNC(obra){
  const contagem = {}; // "FVS-XX / Nome" -> total de itens NC
  obra.pavimentos.forEach(pav=>todosAmbientesDoPavimento(pav).forEach(amb=>amb.fvsList.forEach(fvsInst=>{
    const ncCount = fvsInst.itens.filter(i=>i.status==="nc").length;
    if(!ncCount) return;
    const chave = `${fvsInst.codigo} / ${fvsInst.nome}`;
    contagem[chave] = (contagem[chave]||0) + ncCount;
  })));

  const card = document.createElement("div");
  card.className="chart-card";
  const h3 = document.createElement("h3"); h3.textContent="Serviços com mais não conformidades";
  card.appendChild(h3);

  const ranking = Object.entries(contagem).sort((a,b)=>b[1]-a[1]).slice(0,8);
  if(!ranking.length){
    const p = document.createElement("div"); p.className="empty"; p.style.padding="10px";
    p.textContent="Nenhuma não conformidade registrada até o momento.";
    card.appendChild(p);
    return card;
  }

  const max = ranking[0][1];
  ranking.forEach(([nome, qtd])=>{
    const row = document.createElement("div");
    row.className="bar-row";
    const largura = Math.round((qtd/max)*100);
    row.innerHTML = `
      <div class="lbl" style="width:150px;" title="${escapeHtml(nome)}">${escapeHtml(nome)}</div>
      <div class="track" style="background:var(--nc-bg);"><div class="fill" style="width:${largura}%;background:var(--chart-critical);"></div></div>
      <div class="val">${qtd}</div>`;
    card.appendChild(row);
  });
  return card;
}

function graficoAprovacoes(obra){
  const todasFvs = todosAmbientesDaObra(obra).flatMap(a=>a.fvsList);
  const completas = todasFvs.filter(fvsCompleto);

  const card = document.createElement("div");
  card.className="chart-card";
  const h3 = document.createElement("h3"); h3.textContent="FVS's / Aprovações";
  card.appendChild(h3);

  if(!completas.length){
    const p = document.createElement("div"); p.className="empty"; p.style.padding="10px";
    p.textContent="Nenhuma FVS totalmente verificada ainda.";
    card.appendChild(p);
    return card;
  }

  const aprovadas = completas.filter(f=>fvsAprovacao(f).status==="aprovado").length;
  const aAprovar = completas.length - aprovadas;

  const wrap = document.createElement("div");
  wrap.style.display="flex"; wrap.style.alignItems="center"; wrap.style.gap="12px"; wrap.style.flexWrap="wrap";

  const size=96, r=34, cx=size/2, cy=size/2, strokeW=14;
  const circunf = 2*Math.PI*r;
  const fatias = [
    {v:aprovadas, cor:"var(--chart-good)"},
    {v:aAprovar, cor:"var(--chart-grid)"}
  ].filter(f=>f.v>0);

  const svg = svgEl("svg", {width:size, height:size, viewBox:`0 0 ${size} ${size}`, role:"img", "aria-label":"FVS aprovadas versus a aprovar"});
  const bg = svgEl("circle", {cx, cy, r, fill:"none", stroke:"var(--chart-grid)", "stroke-width":strokeW});
  svg.appendChild(bg);

  let acumulado = 0;
  fatias.forEach(f=>{
    const frac = f.v/completas.length;
    const dash = frac*circunf;
    const gap = Math.max(circunf - dash - 2, 0);
    const offset = -acumulado*circunf - 1;
    const seg = svgEl("circle", {
      cx, cy, r, fill:"none", stroke:f.cor, "stroke-width":strokeW,
      "stroke-dasharray": `${Math.max(dash-2,0)} ${gap+2}`,
      "stroke-dashoffset": offset,
      transform: `rotate(-90 ${cx} ${cy})`
    });
    seg.setAttribute("stroke-linecap","round");
    svg.appendChild(seg);
    acumulado += frac;
  });

  const centroTxt = svgEl("text", {x:cx, y:cy-1, "text-anchor":"middle", "font-size":"15", "font-weight":"700", fill:"var(--text)"});
  centroTxt.textContent = Math.round((aprovadas/completas.length)*100)+"%";
  svg.appendChild(centroTxt);
  const centroLbl = svgEl("text", {x:cx, y:cy+11, "text-anchor":"middle", "font-size":"7.5", fill:"var(--chart-muted)"});
  centroLbl.textContent = "aprovadas";
  svg.appendChild(centroLbl);
  wrap.appendChild(svg);

  const tabela = document.createElement("table");
  tabela.style.cssText = "border-collapse:collapse;font-size:11.5px;";
  tabela.innerHTML = `
    <tr><td style="padding:3px 10px 3px 0;color:var(--muted);">FVS's Aprovadas</td><td style="padding:3px 0;font-weight:700;text-align:right;">${aprovadas}</td></tr>
    <tr><td style="padding:3px 10px 3px 0;color:var(--muted);">FVS's à aprovar</td><td style="padding:3px 0;font-weight:700;text-align:right;">${aAprovar}</td></tr>`;
  wrap.appendChild(tabela);

  card.appendChild(wrap);
  return card;
}

function painelReinspecoes(obra){
  const todasFvs = todosAmbientesDaObra(obra).flatMap(a=>a.fvsList);
  let vencidas=0, agendadas=0, naoAgendadas=0;
  todasFvs.forEach(f=>{
    const s = statusReinspecao(f);
    if(s==="vencida") vencidas++;
    else if(s==="agendada") agendadas++;
    else if(s==="nao_agendada") naoAgendadas++;
  });

  const card = document.createElement("div");
  card.className="chart-card";
  const h3 = document.createElement("h3"); h3.textContent="Verificações com reinspeção pendente";
  card.appendChild(h3);

  if(!vencidas && !agendadas && !naoAgendadas){
    const p = document.createElement("div"); p.className="empty"; p.style.padding="10px";
    p.textContent="Nenhuma reinspeção pendente no momento.";
    card.appendChild(p);
    return card;
  }

  const row = document.createElement("div");
  row.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;";
  [["Vencidas",vencidas,"var(--chart-critical)"],["Agendadas",agendadas,"var(--chart-good)"],["Não agendadas",naoAgendadas,"var(--chart-muted)"]].forEach(([lbl,n,cor])=>{
    const box = document.createElement("div");
    box.style.cssText = `flex:1;min-width:80px;border:1px solid ${cor};border-radius:8px;padding:7px;text-align:center;`;
    box.innerHTML = `<div style="font-size:9.5px;font-weight:700;color:${cor};text-transform:uppercase;letter-spacing:.02em;margin-bottom:4px;">${lbl}</div><div style="font-size:16px;font-weight:700;">${n}</div>`;
    row.appendChild(box);
  });
  card.appendChild(row);
  return card;
}

function moverPavimento(obra, idx, delta){
  const novoIdx = idx + delta;
  if(novoIdx < 0 || novoIdx >= obra.pavimentos.length) return;
  const [item] = obra.pavimentos.splice(idx, 1);
  obra.pavimentos.splice(novoIdx, 0, item);
  saveDB(db);
  render();
}

    main.innerHTML = `<div class="empty">Nenhum fornecedor/encarregado cadastrado.<br>Toque em "+" para cadastrar o primeiro.</div>`;
  } else {
    const todasFvs = todasFvsComContexto(obra);
    fornecedores.forEach(forn=>{
      const atribuidas = todasFvs.filter(t=>t.fvsInst.fornecedorId===forn.id);
      const ncCount = atribuidas.reduce((s,t)=>s+t.fvsInst.itens.filter(i=>i.status==="nc").length,0);
      const item = document.createElement("div");
      item.className="list-item";
      item.onclick=()=>go({view:"fornecedor", obraId:obra.id, fornecedorId:forn.id});

        <div class="icon">${icon('worker')}</div>
        <div class="info">
          <div class="title">${escapeHtml(forn.nome)}</div>
          <div class="sub">${escapeHtml(forn.telefone||"sem telefone")} · ${atribuidas.length} serviço(s)${ncCount?` · ${ncCount} NC`:""}</div>
        </div>
        <div class="chevron">${icon('chevron')}</div>`;
      main.appendChild(item);
    });
  }
  app.appendChild(main);

  const fab = document.createElement("button");
  fab.className="fab"; fab.textContent="+";
  fab.onclick=()=>promptFornecedor(obra);
  app.appendChild(fab);
}

function promptFornecedor(obra, existente){

function promptNovoAmbiente(container, sugestoes){
  const selecionados = new Set();
  const jaExistentes = new Set(container.ambientes.map(a=>a.nome.toLowerCase()));
  let chipsHtml = "";
  if(sugestoes && sugestoes.length){
    chipsHtml = `<label>Sugestões (toque para selecionar, pode escolher várias)</label>
      <div class="import-chips" id="m-chips" style="margin-top:6px;">
        ${sugestoes.map(nome=>{
          const jaTem = jaExistentes.has(nome.toLowerCase());
          return `<button type="button" class="import-chip" data-nome="${escapeHtml(nome)}" ${jaTem?'disabled style="opacity:.4;"':''}>${escapeHtml(nome)}${jaTem?' ✓':''}</button>`;
        }).join("")}
      </div>`;
  }
  openModal(`
    <h2>Novo Ambiente</h2>
    ${chipsHtml}
    <label style="margin-top:${sugestoes&&sugestoes.length?'16px':'0'};">Nome do ambiente (opcional, além das sugestões)</label>
    <input id="m-nome" placeholder="Ex: Banheiro 1, Fachada Norte">
    <button class="btn primary" id="m-salvar">Adicionar</button>
  `);
  if(sugestoes && sugestoes.length){
    document.querySelectorAll("#m-chips .import-chip").forEach(chip=>{
      if(chip.disabled) return;
      chip.onclick=()=>{
        const nome = chip.dataset.nome;
        if(selecionados.has(nome)) selecionados.delete(nome); else selecionados.add(nome);
        chip.classList.toggle("on", selecionados.has(nome));
      };
    });
  }
  document.getElementById("m-salvar").onclick=()=>{
    const nomeLivre = document.getElementById("m-nome").value.trim();
    const nomes = [...selecionados];
    if(nomeLivre) nomes.push(nomeLivre);
    if(!nomes.length) return alert("Selecione uma sugestão ou digite um nome.");
    nomes.forEach(nome=>container.ambientes.push({ id:uid(), nome, fvsList:[] }));
    saveDB(db); closeModal();
    render();
  };
}
