function abrirCatalogo(amb){
  const jaAdicionados = new Set(amb.fvsList.map(f=>f.codigo+"|"+f.rev));
  const selecionados = new Set();
  let html = `<h2>Adicionar Serviço (FVS)</h2><input class="search-box" id="m-busca" placeholder="Buscar por código ou nome...">`;
  html += `<div id="m-lista"></div>`;
  html += `<div class="save-bar"><button class="btn primary" id="m-adicionar-sel" disabled>Adicionar (0 selecionado(s))</button></div>`;
  openModal(html);

  function atualizarBotao(){
    const btn = document.getElementById("m-adicionar-sel");
    btn.textContent = `Adicionar (${selecionados.size} selecionado${selecionados.size===1?'':'s'})`;
    btn.disabled = selecionados.size===0;
  }

  function renderLista(filtro){
    const lista = document.getElementById("m-lista");
    if(!window.FVS_CATALOGO || !window.FVS_CATALOGO.length){
      lista.innerHTML = `<div class="empty">Catálogo de FVS não carregado neste computador ainda.<br>Peça o arquivo scripts/catalogo-fvs.js para habilitar esta tela.</div>`;
      return;
    }
    const f = (filtro||"").toLowerCase();
    const filtrados = FVS_CATALOGO.filter(fvs =>
      fvs.codigo.toLowerCase().includes(f) || fvs.nome.toLowerCase().includes(f)
    );
    lista.innerHTML = filtrados.map((fvs)=>{
      const key = fvs.codigo+"|"+fvs.rev;
      const jaTem = jaAdicionados.has(key);
      const sel = selecionados.has(key);
      return `<div class="list-item ${sel?'selecionado':''}" style="${jaTem?'opacity:.45;pointer-events:none;':''}" data-idx="${FVS_CATALOGO.indexOf(fvs)}">
        <input type="checkbox" ${sel?'checked':''} ${jaTem?'disabled':''} style="width:18px;height:18px;flex-shrink:0;margin:0;">
        <div class="icon">${icon('clipboard')}</div>
        <div class="info">
          <div class="title">${escapeHtml(fvs.codigo)} / ${escapeHtml(fvs.nome)}</div>
          <div class="sub">Rev.: ${escapeHtml(fvs.rev)} ${jaTem?' · já adicionado':''}</div>
        </div>
      </div>`;
    }).join("") || `<div class="empty">Nenhum serviço encontrado.</div>`;
    lista.querySelectorAll(".list-item").forEach(el=>{
      const fvs = FVS_CATALOGO[parseInt(el.dataset.idx)];
      const key = fvs.codigo+"|"+fvs.rev;
      const cb = el.querySelector("input[type=checkbox]");
      const alternar = ()=>{
        if(jaAdicionados.has(key)) return;
        if(selecionados.has(key)) selecionados.delete(key); else selecionados.add(key);
        el.classList.toggle("selecionado", selecionados.has(key));
        cb.checked = selecionados.has(key);
        atualizarBotao();
      };
      el.onclick=(e)=>{ if(e.target!==cb) alternar(); };
      cb.onclick=(e)=>{ e.stopPropagation(); alternar(); };
    });
  }
  renderLista("");
  document.getElementById("m-busca").oninput=(e)=>renderLista(e.target.value);
  document.getElementById("m-adicionar-sel").onclick=()=>{
    if(!selecionados.size) return;
    selecionados.forEach(key=>{
      const fvs = FVS_CATALOGO.find(f=>f.codigo+"|"+f.rev===key);
      if(fvs) amb.fvsList.push(criarInstanciaFvs(fvs));
    });
    saveDB(db); closeModal(); render();
  };
}

function criarInstanciaFvs(fvs){
  return {
    instId: uid(),
    codigo: fvs.codigo, nome: fvs.nome, rev: fvs.rev, normas: fvs.normas,
    itens: fvs.itens.map(txt=>({
      texto:txt, status:"pend", obs:"", foto:null,
      subitens: subChecksDoItem(fvs.codigo, fvs.rev, txt).map(s=>({ texto:s, status:"pend" }))
    })),
    aprovacao: { status:"pendente", aprovadoEm:null },
    reinspecao: { agendadaPara:null },
    fornecedorId: null
  };
}

// ---------- CHECKLIST DE UMA FVS ----------
function abrirChecklist(obra,pav,amb,fvsInst){
  let dirty = false;
  function fecharComConfirmacao(){
    if(dirty && !confirm("Você tem alterações não salvas. Sair mesmo assim?")) return;
    closeModal();
  }
  function atualizarBotaoSalvar(){
    const btn = document.getElementById("m-salvar-fvs");
    if(!btn) return;
    btn.innerHTML = dirty? icon('floppy')+' Salvar' : icon('check')+' Salvo';
    btn.className = "btn primary "+(dirty?'save-pending':'save-ok');
  }
  function draw(){
    const normasHtml = fvsInst.normas.map(n=>`• ${escapeHtml(n)}`).join("<br>");
    const fornecedores = fornecedoresDaObra(obra);
    const opcoesFornecedor = fornecedores.map(f=>`<option value="${f.id}" ${fvsInst.fornecedorId===f.id?'selected':''}>${escapeHtml(f.nome)}</option>`).join("");
    let html = `<button class="close-x" id="m-close">×</button>
      <h2>${escapeHtml(fvsInst.codigo)} / ${escapeHtml(fvsInst.nome)}</h2>
      <div class="normas-box"><b>Normas de referência:</b><br>${normasHtml}</div>
      <label>Fornecedor/Encarregado responsável</label>
      <select id="m-fornecedor">
        <option value="">— Nenhum —</option>
        ${opcoesFornecedor}
      </select>
      <div id="m-aprov-reinsp-wrap">${blocoAprovacaoReinspecao(fvsInst)}</div>
      <div id="m-itens"></div>
      <div class="save-bar">
        <button class="btn primary ${dirty?'save-pending':'save-ok'}" id="m-salvar-fvs">${dirty? icon('floppy')+' Salvar' : icon('check')+' Salvo'}</button>
      </div>
      <button class="btn ghost" id="m-remover">Remover este serviço do ambiente</button>`;
    openModal(html);
    document.getElementById("m-close").onclick=fecharComConfirmacao;
    document.getElementById("modal-bg").onclick=(e)=>{ if(e.target.id==="modal-bg") fecharComConfirmacao(); };
    document.getElementById("m-salvar-fvs").onclick=()=>{
      saveDB(db);
      dirty = false;
      atualizarBotaoSalvar();
    };
    document.getElementById("m-remover").onclick=()=>{
      if(confirm("Remover "+fvsInst.codigo+" deste ambiente? Isso apaga os registros de verificação feitos.")){
        amb.fvsList = amb.fvsList.filter(f=>f.instId!==fvsInst.instId);
        saveDB(db); closeModal(); render();
      }
    };

    function atualizarBlocoAprovacaoReinspecao(){
      const wrap = document.getElementById("m-aprov-reinsp-wrap");
      if(!wrap) return;
      wrap.innerHTML = blocoAprovacaoReinspecao(fvsInst);
      wireBlocoAprovacaoReinspecao();
    }
    function wireBlocoAprovacaoReinspecao(){
      const btnToggleAprov = document.getElementById("m-toggle-aprovacao");
      if(btnToggleAprov) btnToggleAprov.onclick=()=>{
        const aprov = fvsAprovacao(fvsInst);
        if(aprov.status==="aprovado"){ aprov.status="pendente"; aprov.aprovadoEm=null; }
        else { aprov.status="aprovado"; aprov.aprovadoEm=Date.now(); }
        dirty = true; atualizarBotaoSalvar();
        atualizarBlocoAprovacaoReinspecao();
      };
      const inputReinsp = document.getElementById("m-data-reinsp");
      if(inputReinsp) inputReinsp.onchange=()=>{
        fvsReinspecao(fvsInst).agendadaPara = inputReinsp.value || null;
        dirty = true; atualizarBotaoSalvar();
        atualizarBlocoAprovacaoReinspecao();
      };
    }
    wireBlocoAprovacaoReinspecao();

    document.getElementById("m-fornecedor").onchange=(e)=>{
      fvsInst.fornecedorId = e.target.value || null;
      dirty = true; atualizarBotaoSalvar();
    };
    const cont = document.getElementById("m-itens");
    fvsInst.itens.forEach((item, idx)=>{
      if(!item.subitens) item.subitens = [];
      item.subitens.forEach(s=>{ if(s.status===undefined) s.status = s.feito ? "ok" : "pend"; });
      const box = document.createElement("div");
      box.className="checklist-item";

      const iconesStatus = (statusAtual, extraAttrs)=>`
        <div class="status-row-icons" ${extraAttrs||""}>
          <button class="status-icon-btn ${statusAtual==='ok'?'sel-ok':''}" data-s="ok" title="Conforme" ${item.status==='na'&&extraAttrs?'disabled':''}>${icon('thumbup')}</button>
          <button class="status-icon-btn ${statusAtual==='nc'?'sel-nc':''}" data-s="nc" title="Não conforme" ${item.status==='na'&&extraAttrs?'disabled':''}>${icon('thumbdown')}</button>
          <button class="status-icon-btn ${statusAtual==='parcial'?'sel-parcial':''}" data-s="parcial" title="Parcialmente conforme" ${item.status==='na'&&extraAttrs?'disabled':''}>${icon('bubble')}</button>
          <button class="status-icon-btn ${statusAtual==='na'?'sel-na':''}" data-s="na" title="Não aplicável" ${item.status==='na'&&extraAttrs?'disabled':''}>${icon('ban')}</button>
          <button class="status-icon-btn ${(!statusAtual||statusAtual==='pend')?'sel-pend':''}" data-s="pend" title="Pendente" ${item.status==='na'&&extraAttrs?'disabled':''}>${icon('hourglass')}</button>
        </div>`;

      const temSub = item.subitens.length > 0;
      const subChecksHtml = temSub ? `
        <div class="sub-checks">
          ${item.subitens.map((s,si)=>`
            <div class="sub-check-row ${item.status==='na'?'disabled':''}">
              <span class="sub-check-txt">${escapeHtml(s.texto)}</span>
              ${iconesStatus(s.status, `data-si="${si}"`)}
            </div>`).join("")}
        </div>` : iconesStatus(item.status);

      box.innerHTML = `
        <div class="txt">${idx+1}. ${escapeHtml(item.texto)}
          <span class="item-status-badge ${item.status||'pend'}">${legendaStatusItem(item)}</span>
        </div>
        ${subChecksHtml}
        <div class="item-extra">
          ${temSub? `<button class="na-btn ${item.status==='na'?'active':''}" data-act="na">${item.status==='na'?'✓ N/A':'Marcar como N/A'}</button>` : ""}
          <button class="photo-btn" data-act="foto">${icon('camera')}</button>
          ${item.foto? `<img class="photo-thumb" src="${item.foto}">` : ""}
          <textarea placeholder="Observação (opcional)">${escapeHtml(item.obs||"")}</textarea>
        </div>
      `;

      function recalcularStatusItem(){
        if(item.status==='na') return;
        if(!temSub){ return; }
        item.status = statusPorSubitens(item.subitens);
        const pendentes = item.subitens.filter(s=>s.status!=='ok' && s.status!=='na').map(s=>s.texto);
        atualizarObsAutomatica(item, pendentes);
        const badge = box.querySelector(".item-status-badge");
        badge.className = "item-status-badge "+item.status;
        badge.textContent = legendaStatusItem(item);
        const textarea = box.querySelector("textarea");
        textarea.value = item.obs||"";
        atualizarBlocoAprovacaoReinspecao();
      }

      if(temSub){
        box.querySelectorAll('.sub-check-row .status-row-icons').forEach(rowIcons=>{
          const si = parseInt(rowIcons.dataset.si);
          rowIcons.querySelectorAll(".status-icon-btn").forEach(btn=>{
            btn.onclick=()=>{
              item.subitens[si].status = btn.dataset.s;
              dirty = true;
              rowIcons.querySelectorAll(".status-icon-btn").forEach(b=>b.classList.remove("sel-ok","sel-nc","sel-parcial","sel-na","sel-pend"));
              btn.classList.add("sel-"+btn.dataset.s);
              recalcularStatusItem();
              atualizarBotaoSalvar();
            };
          });
        });
      } else {
        box.querySelectorAll(".status-icon-btn").forEach(btn=>{
          btn.onclick=()=>{
            item.status = btn.dataset.s;
            dirty = true;
            box.querySelectorAll(".status-icon-btn").forEach(b=>b.classList.remove("sel-ok","sel-nc","sel-parcial","sel-na","sel-pend"));
            btn.classList.add("sel-"+btn.dataset.s);
            const badge = box.querySelector(".item-status-badge");
            badge.className = "item-status-badge "+item.status;
            badge.textContent = legendaStatusItem(item);
            atualizarBotaoSalvar();
            atualizarBlocoAprovacaoReinspecao();
            if(btn.dataset.s==="parcial") box.querySelector("textarea").focus();
          };
        });
      }

      const naBtn = box.querySelector('[data-act="na"]');
      if(naBtn) naBtn.onclick=()=>{
        item.status = (item.status==='na') ? statusPorSubitens(item.subitens) : 'na';
        dirty = true;
        draw();
      };

      const fotoBtn = box.querySelector('[data-act="foto"]');
      fotoBtn.onclick=()=>{
        const input = document.createElement("input");
        input.type="file"; input.accept="image/*"; input.capture="environment";
        input.onchange=()=>{
          const file = input.files[0];
          if(!file) return;
          const reader = new FileReader();
          reader.onload=(e)=>{
            item.foto = e.target.result;
            dirty = true;
            let thumb = box.querySelector(".photo-thumb");
            if(!thumb){
              thumb = document.createElement("img");
              thumb.className = "photo-thumb";
              fotoBtn.insertAdjacentElement("afterend", thumb);
            }
            thumb.src = item.foto;
            atualizarBotaoSalvar();
          };
          reader.readAsDataURL(file);
        };
        input.click();
      };
      const textarea = box.querySelector("textarea");
      textarea.oninput=()=>{ item.obs = textarea.value; dirty = true; atualizarBotaoSalvar(); };
      cont.appendChild(box);
    });
  }
  draw();
}

// ---------- IMPORTAR PLANTA (PDF/DXF) ----------
// Bibliotecas carregadas sob demanda (só quando o usuário abre essa tela), via CDN.
// Precisa de internet nesse momento — o resto do app funciona offline normalmente.
const PDFJS_VERSAO = "4.7.76";
const CDN_PDFJS = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSAO}/pdf.min.mjs`;
const CDN_PDFJS_WORKER = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSAO}/pdf.worker.min.mjs`;
const CDN_DXFPARSER = "https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/dist/dxf-parser.js";

const _scriptsCarregados = {};
function carregarScript(src){
  if(_scriptsCarregados[src]) return _scriptsCarregados[src];
  _scriptsCarregados[src] = new Promise((resolve,reject)=>{
    const s = document.createElement("script");
    s.src = src;
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error("não consegui carregar um componente necessário (verifique sua internet)"));
    document.head.appendChild(s);
  });
  return _scriptsCarregados[src];
}

let _pdfjsLibPromise = null;
function carregarPdfJs(){
  if(_pdfjsLibPromise) return _pdfjsLibPromise;
  _pdfjsLibPromise = import(CDN_PDFJS).then(mod=>{
    mod.GlobalWorkerOptions.workerSrc = CDN_PDFJS_WORKER;
    return mod;
  }).catch(()=>{
    _pdfjsLibPromise = null;
    throw new Error("não consegui carregar o leitor de PDF (verifique sua internet)");
  });
  return _pdfjsLibPromise;
}

function textoPareceAmbiente(t){
  if(!t) return false;
  t = t.trim();
  if(t.length < 2 || t.length > 40) return false;
  if(/^[\d.,;:\-\/°ºm²\s]+$/i.test(t)) return false; // só números/medidas, não é nome
  return true;
}

function ordenarCandidatos(lista){
  return lista.slice().sort((a,b)=> (b.y-a.y) || (a.x-b.x)); // topo→baixo, esquerda→direita
}

function limparTextoMTEXT(t){
  return (t||"")
    .replace(/\\P/g, " ")
    .replace(/\\[A-Za-z][^;]*;/g, "")
    .replace(/[{}]/g, "")
    .replace(/%%[cCdDpP]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function escolherPaginaPdf(numPaginas){
  return new Promise(resolve=>{
    let opts = "";
    for(let i=1;i<=numPaginas;i++) opts += `<option value="${i}">Página ${i}</option>`;
    openModal(`
      <h2>Qual página é este pavimento?</h2>
      <p style="font-size:13px;color:var(--muted);">Esse PDF tem ${numPaginas} páginas. A importação lê uma página por vez.</p>
      <select id="m-pagina">${opts}</select>
      <button class="btn primary" id="m-continuar">Continuar</button>
    `);
    document.getElementById("m-continuar").onclick=()=>{
      const pagina = parseInt(document.getElementById("m-pagina").value);
      closeModal();
      resolve(pagina);
    };
  });
}

async function extrairTextosDePdf(file, statusEl){
  statusEl.textContent = "Carregando leitor de PDF...";
  const pdfjsLib = await carregarPdfJs();
  const buffer = await file.arrayBuffer();
  const doc = await pdfjsLib.getDocument({data:buffer}).promise;
  let pagina = 1;
  if(doc.numPages > 1) pagina = await escolherPaginaPdf(doc.numPages);
  statusEl.textContent = "Lendo texto da página...";
  const page = await doc.getPage(pagina);
  const content = await page.getTextContent();
  const candidatos = content.items
    .map(it=>({ texto:(it.str||"").trim(), x:it.transform[4], y:it.transform[5] }))
    .filter(it=>textoPareceAmbiente(it.texto));
  return ordenarCandidatos(candidatos);
}

// Extração crua: todo texto do DXF, sem nenhum filtro de classificação ainda.
// Reaproveitada tanto pelo import de um pavimento quanto pelo import do prédio inteiro.
// Retorna { textos, layers }: textos = só entidades TEXT/MTEXT; layers = nome de
// TODAS as layers do desenho (inclusive as que só têm linha/geometria, sem texto —
// importante porque a layer do pavimento pode não ter texto nenhum nela mesma,
// só nas layers satélite de disciplina, ex.: "P04" sem texto + "5-TEXTOS4" com texto).
async function extrairEntidadesDxf(file, statusEl){
  if(statusEl) statusEl.textContent = "Carregando leitor de DXF...";
  await carregarScript(CDN_DXFPARSER);
  const texto = await file.text();
  if(statusEl) statusEl.textContent = "Lendo entidades do DXF...";
  const parser = new window.DxfParser();
  const dxf = parser.parseSync(texto);
  const todasEntidades = dxf.entities || [];
  const layers = [...new Set(todasEntidades.map(e=> e.layer || "0"))];
  const textos = todasEntidades
    .filter(e=>e.type==="TEXT"||e.type==="MTEXT")
    .map(e=>({
      texto: limparTextoMTEXT(e.text||""),
      x: e.position ? e.position.x : (e.startPoint ? e.startPoint.x : 0),
      y: e.position ? e.position.y : (e.startPoint ? e.startPoint.y : 0),
      layer: e.layer || "0"
    }));
  return { textos, layers };
}

async function extrairTextosDeDxf(file, statusEl){
  const { textos } = await extrairEntidadesDxf(file, statusEl);
  return ordenarCandidatos(textos.filter(it=>textoPareceAmbiente(it.texto)));
}

// Sugestão de FVS por tipo de ambiente (casamento por palavra-chave no nome)
const SUGESTOES_FVS_POR_AMBIENTE = [
  { palavras:["banheiro","lavabo","wc"], codigos:["FVS-19","FVS-23","FVS-41","FVS-42","FVS-10"] },
  { palavras:["cozinha"], codigos:["FVS-19","FVS-23","FVS-37","FVS-41","FVS-10"] },
  { palavras:["fachada"], codigos:["FVS-18","FVS-28"] },
  { palavras:["sala","quarto","dormitorio","suite","escritorio"], codigos:["FVS-21","FVS-22","FVS-40"] },
  { palavras:["varanda","sacada","terraco"], codigos:["FVS-18","FVS-19"] },
  { palavras:["area de servico","lavanderia"], codigos:["FVS-19","FVS-23","FVS-10"] },
  { palavras:["hall","corredor","circulacao"], codigos:["FVS-21","FVS-22"] },
  { palavras:["garagem","estacionamento"], codigos:["FVS-22"] },
];

function normalizarTexto(t){
  const s = (t||"").toLowerCase().normalize("NFD");
  let out = "";
  for(const ch of s){
    const code = ch.codePointAt(0);
    if(code >= 0x300 && code <= 0x36f) continue; // remove marcas diacríticas (acentos) após normalize("NFD")
    out += ch;
  }
  return out;
}

function sugerirFvsPara(nomeAmbiente){
  const n = normalizarTexto(nomeAmbiente);
  const codigos = new Set();
  SUGESTOES_FVS_POR_AMBIENTE.forEach(grupo=>{
    if(grupo.palavras.some(p=>n.includes(normalizarTexto(p)))) grupo.codigos.forEach(c=>codigos.add(c));
  });
  if(!window.FVS_CATALOGO) return [];
  return [...codigos].map(cod=>window.FVS_CATALOGO.find(f=>f.codigo===cod)).filter(Boolean);
}

// ---------- IMPORTAÇÃO DO PROJETO COMPLETO (DXF, vários pavimentos de uma vez) ----------
function distancia(a,b){ const dx=a.x-b.x, dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy); }

function textoBateEmLista(texto, lista){
  const n = normalizarTexto(texto);
  return lista.some(termo=> n.includes(normalizarTexto(termo)));
}

function escapeRegexBasico(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }

function textoEhNomeDeComodo(t){
  const n = normalizarTexto(t);
  return (window.NOMES_COMODO||[]).some(termo=>{
    const re = new RegExp("(^|[^a-z0-9])"+escapeRegexBasico(normalizarTexto(termo))+"([^a-z0-9]|$)");
    return re.test(n);
  });
}

const MARCADORES_UNIDADE = ["apto","apartamento","unidade","und","loja","sala comercial"];
const MARCADORES_AREA_ESPECIAL = [
  "escada","hall","corredor","circulacao","area comum",
  "casa de maquinas","barrilete","reservatorio",
  "gerador","subestacao","area tecnica","dce",
  "portaria","guarita","poco de elevador","lixeira"
];

// Separa uma lista plana de textos (já filtrados por textoPareceAmbiente) em:
// rótulos de unidade autônoma, áreas comuns/técnicas/especiais, e nomes de cômodo
// (só os que batem na whitelist), associando cada cômodo à unidade mais próxima.
// Reaproveitada tanto pelo import do prédio inteiro (por grupo de layer) quanto
// pelo import de um pavimento/unidade por vez (sobre todo o texto do arquivo).
function classificarTextosPlanos(textos){
  const rotulosUnidade = textos.filter(it=>textoBateEmLista(it.texto, MARCADORES_UNIDADE));
  const rotulosSet = new Set(rotulosUnidade);
  const areasEspeciais = textos.filter(it=> !rotulosSet.has(it) && textoBateEmLista(it.texto, MARCADORES_AREA_ESPECIAL));
  const areasSet = new Set(areasEspeciais);
  const restante = textos.filter(it=> !rotulosSet.has(it) && !areasSet.has(it));
  const candidatosComodo = restante.filter(it=>textoEhNomeDeComodo(it.texto));
  const naoReconhecidos = restante.filter(it=>!candidatosComodo.includes(it));

  const unidades = rotulosUnidade.map(rotulo=>({ id:uid(), nome: rotulo.texto.trim(), origem: rotulo }));

  const comodos = candidatosComodo.map(c=>{
    let unidadeId = null;
    if(unidades.length){
      let melhor = unidades[0], melhorDist = distancia(c, unidades[0].origem);
      for(let i=1;i<unidades.length;i++){
        const d = distancia(c, unidades[i].origem);
        if(d < melhorDist){ melhorDist = d; melhor = unidades[i]; }
      }
      unidadeId = melhor.id;
    }
    return { texto: c.texto, unidadeId };
  });

  const comuns = areasEspeciais.map(a=>a.texto)
    .concat(comodos.filter(c=>c.unidadeId===null).map(c=>c.texto));

  return {
    unidades: unidades.map(u=>({ id:u.id, nome:u.nome })),
    comodosPorUnidade: comodos.filter(c=>c.unidadeId!==null),
    comuns,
    naoReconhecidos: naoReconhecidos.map(n=>n.texto)
  };
}

function prepararEstadoPavimento(pClass){
  function criarEstadoItem(texto, unidadeId){
    const sugeridos = sugerirFvsPara(texto);
    return { id:uid(), texto, usar:true, unidadeId,
      fvsSugeridos: sugeridos, fvsSelecionados: new Set(sugeridos.map(f=>f.codigo)) };
  }
  const itens = pClass.comodosPorUnidade.map(c=>criarEstadoItem(c.texto, c.unidadeId))
    .concat(pClass.comuns.map(t=>criarEstadoItem(t, null)));
  return {
    id: uid(), nome: pClass.nome, usar: true,
    unidades: pClass.unidades.map(u=>({ id:u.id, nome:u.nome, usar:true })),
    itens,
    naoReconhecidos: pClass.naoReconhecidos.map(t=>({ id:uid(), texto:t, usar:false }))
  };
}

function abrirRevisaoImportacaoPredio(obra, resultado, textoIntro){
  const pavimentosEstado = resultado.pavimentos.map(prepararEstadoPavimento);
  const intro = textoIntro || `${pavimentosEstado.length} pavimento(s) identificado(s) pelas layers do DXF. Confira nomes, unidades e ambientes antes de criar — desmarque o que estiver errado, e use o menu ao lado de cada ambiente pra corrigir a unidade, se precisar.`;

  openModal(`
    <h2>Revisar itens encontrados</h2>
    <p style="font-size:13px;color:var(--muted);">${intro}</p>
    <div id="m-arvore-import"></div>
    <button class="btn primary" id="m-confirmar-predio">Criar tudo</button>
  `);
  const raiz = document.getElementById("m-arvore-import");

  function desenharItemComodo(it, pav){
    const itemDiv = document.createElement("div");
    itemDiv.className = "import-item";
    const linha1 = document.createElement("div");
    linha1.className = "linha1";
    const chk = document.createElement("input");
    chk.type="checkbox"; chk.checked = it.usar;
    chk.onchange = ()=>{ it.usar = chk.checked; };
    const txt = document.createElement("input");
    txt.type="text"; txt.value = it.texto;
    txt.oninput = ()=>{ it.texto = txt.value; };
    linha1.appendChild(chk); linha1.appendChild(txt);

    if(pav.unidades.length){
      const sel = document.createElement("select");
      sel.className = "import-select-unid";
      const optComum = document.createElement("option");
      optComum.value=""; optComum.textContent="Ambiente comum";
      sel.appendChild(optComum);
      pav.unidades.forEach(u=>{
        const opt = document.createElement("option");
        opt.value=u.id; opt.textContent=u.nome;
        if(it.unidadeId===u.id) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.onchange = ()=>{ it.unidadeId = sel.value || null; redesenharCorpo(pav); };
      linha1.appendChild(sel);
    }
    itemDiv.appendChild(linha1);

    if(it.fvsSugeridos.length){
      const chips = document.createElement("div");
      chips.className = "import-chips";
      it.fvsSugeridos.forEach(fvs=>{
        const chip = document.createElement("button");
        chip.type="button";
        chip.className = "import-chip"+(it.fvsSelecionados.has(fvs.codigo)?" on":"");
        chip.textContent = fvs.codigo; chip.title = fvs.nome;
        chip.onclick = ()=>{
          if(it.fvsSelecionados.has(fvs.codigo)) it.fvsSelecionados.delete(fvs.codigo);
          else it.fvsSelecionados.add(fvs.codigo);
          chip.classList.toggle("on");
        };
        chips.appendChild(chip);
      });
      itemDiv.appendChild(chips);
    }
    return itemDiv;
  }

  function redesenharCorpo(pav){
    const corpo = pav._corpoEl;
    corpo.innerHTML = "";
    pav.unidades.forEach(unid=>{
      const bloco = document.createElement("div");
      bloco.style.cssText = "margin-bottom:10px;padding-left:10px;border-left:2px solid var(--border);";
      const tituloUnid = document.createElement("div");
      tituloUnid.style.cssText = "display:flex;align-items:center;gap:8px;margin-bottom:6px;";
      const chkUnid = document.createElement("input");
      chkUnid.type="checkbox"; chkUnid.checked = unid.usar;
      chkUnid.onchange = ()=>{ unid.usar = chkUnid.checked; };
      const nomeUnid = document.createElement("input");
      nomeUnid.type="text"; nomeUnid.value = unid.nome;
      nomeUnid.style.cssText = "margin-top:0;flex:1;font-weight:600;";
      nomeUnid.oninput = ()=>{ unid.nome = nomeUnid.value; };
      tituloUnid.appendChild(chkUnid); tituloUnid.appendChild(nomeUnid);
      bloco.appendChild(tituloUnid);
      pav.itens.filter(it=>it.unidadeId===unid.id).forEach(it=> bloco.appendChild(desenharItemComodo(it, pav)));
      corpo.appendChild(bloco);
    });

    const comuns = pav.itens.filter(it=>it.unidadeId===null);
    if(comuns.length){
      const tit = document.createElement("div");
      tit.className = "import-subtitulo";
      tit.textContent = "Ambientes comuns";
      corpo.appendChild(tit);
      comuns.forEach(it=> corpo.appendChild(desenharItemComodo(it, pav)));
    }

    if(pav.naoReconhecidos.length){
      const det = document.createElement("details");
      det.style.marginTop = "10px";
      const sum = document.createElement("summary");
      sum.style.cssText = "font-size:12px;color:var(--muted);cursor:pointer;";
      sum.textContent = `Outros textos encontrados, não reconhecidos como cômodo (${pav.naoReconhecidos.length})`;
      det.appendChild(sum);
      pav.naoReconhecidos.forEach(it=>{
        const row = document.createElement("label");
        row.className = "sub-check-row";
        row.style.marginTop = "6px";
        const chkNr = document.createElement("input");
        chkNr.type="checkbox"; chkNr.checked = it.usar;
        chkNr.onchange = ()=>{ it.usar = chkNr.checked; };
        const span = document.createElement("span");
        span.textContent = it.texto;
        row.appendChild(chkNr); row.appendChild(span);
        det.appendChild(row);
      });
      corpo.appendChild(det);
    }
  }

  function desenharPavimento(pav){
    const div = document.createElement("div");
    div.className = "import-grupo";

    const header = document.createElement("div");
    header.className = "import-grupo-header";
    const chk = document.createElement("input");
    chk.type="checkbox"; chk.checked = pav.usar;
    chk.onchange = ()=>{ pav.usar = chk.checked; };
    const nomeInput = document.createElement("input");
    nomeInput.type="text"; nomeInput.value = pav.nome;
    nomeInput.oninput = ()=>{ pav.nome = nomeInput.value; };
    const info = document.createElement("span");
    info.className = "import-grupo-info";
    info.textContent = `${pav.unidades.length} unidade(s) · ${pav.itens.length} ambiente(s)`;
    header.appendChild(chk); header.appendChild(nomeInput); header.appendChild(info);
    div.appendChild(header);

    const corpo = document.createElement("div");
    corpo.className = "import-grupo-corpo";
    pav._corpoEl = corpo;
    div.appendChild(corpo);
    redesenharCorpo(pav);
    return div;
  }

  pavimentosEstado.forEach(pav=> raiz.appendChild(desenharPavimento(pav)));

  document.getElementById("m-confirmar-predio").onclick = ()=>{
    pavimentosEstado.forEach(pav=>{
      if(!pav.usar) return;
      let pavReal = obra.pavimentos.find(p=> normalizarTexto(p.nome)===normalizarTexto(pav.nome));
      if(!pavReal){
        pavReal = { id:uid(), nome: pav.nome.trim(), ambientes:[], unidades:[] };
        obra.pavimentos.push(pavReal);
      }
      if(!pavReal.unidades) pavReal.unidades = [];

      const mapaUnidId = {};
      pav.unidades.forEach(u=>{
        if(!u.usar) return;
        let unidReal = pavReal.unidades.find(x=> normalizarTexto(x.nome)===normalizarTexto(u.nome));
        if(!unidReal){
          unidReal = { id:uid(), nome:u.nome.trim(), ambientes:[] };
          pavReal.unidades.push(unidReal);
        }
        mapaUnidId[u.id] = unidReal;
      });

      pav.itens.filter(it=>it.usar && it.texto.trim()).forEach(it=>{
        const amb = { id:uid(), nome: it.texto.trim(), fvsList:[] };
        it.fvsSelecionados.forEach(codigo=>{
          const fvs = window.FVS_CATALOGO && window.FVS_CATALOGO.find(f=>f.codigo===codigo);
          if(fvs) amb.fvsList.push(criarInstanciaFvs(fvs));
        });
        const destino = (it.unidadeId && mapaUnidId[it.unidadeId]) ? mapaUnidId[it.unidadeId] : pavReal;
        destino.ambientes.push(amb);
      });
    });

    saveDB(db); closeModal(); render();
  };
}

function abrirImportarPlanta(obra, pav, unid){
  openModal(`
    <h2>Importar planta (PDF/DXF)</h2>
    <p style="font-size:13px;color:var(--muted);">
      Funciona com PDF exportado do CAD (com texto selecionável) ou arquivo DXF — não funciona com PDF escaneado/foto.
      Precisa de internet só nesta etapa; o resto do app continua funcionando offline.
    </p>
    <input type="file" id="m-arquivo-planta" accept=".pdf,.dxf">
    <div id="m-import-status" style="margin-top:12px;font-size:13px;color:var(--muted);"></div>
  `);
  document.getElementById("m-arquivo-planta").onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const status = document.getElementById("m-import-status");
    status.textContent = "Lendo arquivo...";
    try{
      const ext = file.name.toLowerCase().split(".").pop();
      let textosBrutos;
      if(ext==="pdf") textosBrutos = await extrairTextosDePdf(file, status);
      else if(ext==="dxf") textosBrutos = await extrairTextosDeDxf(file, status);
      else { status.textContent = "Formato não suportado. Escolha um arquivo .pdf ou .dxf."; return; }

      if(!textosBrutos.length){
        status.textContent = "Não encontrei texto nesse arquivo. Se for um PDF escaneado/foto, essa importação automática não funciona — cadastre manualmente com \"Novo Ambiente\".";
        return;
      }

      const classificado = classificarTextosPlanos(textosBrutos);
      const totalCandidatos = classificado.comodosPorUnidade.length + classificado.comuns.length;
      if(!totalCandidatos){
        status.textContent = "Encontrei texto no arquivo, mas nenhum nome de cômodo reconhecido (ex.: Sala, Quarto, Banheiro...). Pode ser que a grafia seja diferente da lista da ferramenta — nesse caso, cadastre manualmente com \"Novo Ambiente\".";
        return;
      }

      if(unid){
        const candidatosParaUnidade = classificado.comodosPorUnidade.map(c=>({texto:c.texto}))
          .concat(classificado.comuns.map(t=>({texto:t})));
        abrirRevisaoImportacao(obra, pav, unid, candidatosParaUnidade);
      } else {
        abrirRevisaoImportacaoPredio(obra, { ok:true, pavimentos:[{ nomeLayer:null, nome: pav.nome, ...classificado }] },
          "Confira os ambientes identificados no arquivo antes de criar — desmarque o que estiver errado, e use o menu ao lado de cada ambiente pra corrigir a unidade, se precisar.");
      }
    }catch(err){
      status.textContent = "Não consegui ler esse arquivo: "+err.message;
    }
  };
}

function abrirRevisaoImportacao(obra, pav, unid, candidatosBrutos){
  const itens = candidatosBrutos.map(c=>{
    const sugeridos = sugerirFvsPara(c.texto);
    return {
      id: uid(), texto: c.texto, usar: true, unidadeTmp: null,
      fvsSugeridos: sugeridos,
      fvsSelecionados: new Set(sugeridos.map(f=>f.codigo))
    };
  });
  const gruposUnidadeTmp = {};

  let html = `<h2>Revisar itens encontrados (${itens.length})</h2>
    <p style="font-size:13px;color:var(--muted);">Desmarque o que não for nome de ambiente (medidas, títulos, notas). Edite o nome se precisar. Os serviços sugeridos já vêm marcados — desmarque os que não fizerem sentido.</p>`;
  if(!unid){
    html += `<button class="btn" id="m-agrupar" style="width:100%;border:1px solid var(--primary);color:var(--primary);background:none;border-radius:8px;padding:10px;font-weight:600;margin-bottom:12px;">${icon('key')} Agrupar marcados em nova unidade</button>`;
  }
  html += `<div id="m-lista-import"></div>
    <button class="btn primary" id="m-confirmar">Criar ambientes selecionados</button>`;
  openModal(html);

  const lista = document.getElementById("m-lista-import");

  function desenharItem(it){
    const div = document.createElement("div");
    div.className = "import-item";

    const linha1 = document.createElement("div");
    linha1.className = "linha1";
    const chk = document.createElement("input");
    chk.type = "checkbox"; chk.checked = it.usar;
    chk.onchange = ()=>{ it.usar = chk.checked; };
    const txt = document.createElement("input");
    txt.type = "text"; txt.value = it.texto;
    txt.oninput = ()=>{ it.texto = txt.value; };
    linha1.appendChild(chk); linha1.appendChild(txt);
    div.appendChild(linha1);

    if(it.unidadeTmp){
      const tagUnid = document.createElement("div");
      tagUnid.style.cssText = "font-size:11px;color:var(--primary);margin-top:4px;";
      tagUnid.innerHTML = icon('key')+" "+escapeHtml(gruposUnidadeTmp[it.unidadeTmp]);
      div.appendChild(tagUnid);
    }

    if(it.fvsSugeridos.length){
      const chips = document.createElement("div");
      chips.className = "import-chips";
      it.fvsSugeridos.forEach(fvs=>{
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "import-chip"+(it.fvsSelecionados.has(fvs.codigo)?" on":"");
        chip.textContent = fvs.codigo;
        chip.title = fvs.nome;
        chip.onclick = ()=>{
          if(it.fvsSelecionados.has(fvs.codigo)) it.fvsSelecionados.delete(fvs.codigo);
          else it.fvsSelecionados.add(fvs.codigo);
          chip.classList.toggle("on");
        };
        chips.appendChild(chip);
      });
      div.appendChild(chips);
    }
    return div;
  }

  function redesenharLista(){
    lista.innerHTML = "";
    itens.forEach(it=> lista.appendChild(desenharItem(it)));
  }
  redesenharLista();

  if(!unid){
    document.getElementById("m-agrupar").onclick = ()=>{
      const marcados = itens.filter(it=>it.usar && !it.unidadeTmp);
      if(!marcados.length) return alert("Marque os itens que você quer agrupar antes.");
      const nome = prompt("Nome da unidade (ex: Apto 301):");
      if(!nome || !nome.trim()) return;
      const grupoId = uid();
      gruposUnidadeTmp[grupoId] = nome.trim();
      marcados.forEach(it=>{ it.unidadeTmp = grupoId; });
      redesenharLista();
    };
  }

  document.getElementById("m-confirmar").onclick = ()=>{
    const selecionados = itens.filter(it=>it.usar && it.texto.trim());
    if(!selecionados.length){ closeModal(); return; }

    function montarAmbiente(it){
      const amb = { id:uid(), nome: it.texto.trim(), fvsList:[] };
      it.fvsSelecionados.forEach(codigo=>{
        const fvs = window.FVS_CATALOGO && window.FVS_CATALOGO.find(f=>f.codigo===codigo);
        if(fvs) amb.fvsList.push(criarInstanciaFvs(fvs));
      });
      return amb;
    }

    if(unid){
      selecionados.forEach(it=> unid.ambientes.push(montarAmbiente(it)));
    } else {
      const porUnidadeTmp = {};
      selecionados.forEach(it=>{
        if(it.unidadeTmp) (porUnidadeTmp[it.unidadeTmp] = porUnidadeTmp[it.unidadeTmp]||[]).push(it);
        else pav.ambientes.push(montarAmbiente(it));
      });
      if(!pav.unidades) pav.unidades = [];
      Object.keys(porUnidadeTmp).forEach(grupoId=>{
        pav.unidades.push({ id:uid(), nome:gruposUnidadeTmp[grupoId], ambientes: porUnidadeTmp[grupoId].map(montarAmbiente) });
      });
    }

    saveDB(db); closeModal(); render();
  };
}

// ---------- MODAL genérico ----------
function openModal(innerHtml){
  closeModal();
  const bg = document.createElement("div");
  bg.className="modal-bg"; bg.id="modal-bg";
  bg.onclick=(e)=>{ if(e.target===bg) closeModal(); };
  const modal = document.createElement("div");
  modal.className="modal";
  modal.innerHTML = innerHtml;
  bg.appendChild(modal);
  document.body.appendChild(bg);
}
function closeModal(){
  const bg = document.getElementById("modal-bg");
  if(bg) bg.remove();
}

// ---------- BACKUP / RESTAURAÇÃO DOS DADOS ----------
function exportarBackup(){
  const dataStr = JSON.stringify(db, null, 2);
  const blob = new Blob([dataStr], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const dataFmt = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `fvs-obras-tergos-backup-${dataFmt}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function restaurarBackup(){
  const input = document.createElement("input");
  input.type="file"; input.accept="application/json,.json";
  input.onchange=()=>{
    const file = input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload=(e)=>{
      let novoDb;
      try{ novoDb = JSON.parse(e.target.result); }
      catch(err){ return alert("Arquivo inválido. Selecione um backup .json exportado por este sistema."); }
      if(!novoDb || !Array.isArray(novoDb.obras)){
        return alert("Arquivo inválido. Selecione um backup .json exportado por este sistema.");
      }
      if(db.obras.length && !confirm(`Restaurar este backup vai SUBSTITUIR os dados atuais (${db.obras.length} obra(s) cadastrada(s) agora). Deseja continuar?`)){
        return;
      }
      db = novoDb;
      saveDB(db);
      render();
      alert("Backup restaurado com sucesso.");
    };
    reader.readAsText(file);
  };
  input.click();
}

// ---------- EXPORTAÇÃO DE RELATÓRIOS EM PDF (via impressão do navegador) ----------
const STATUS_LABEL = { ok:"Conforme", nc:"Não Conforme", parcial:"Parcialmente Conforme", na:"N/A", pend:"Pendente" };

function dataHoraAtual(){
  return new Date().toLocaleString("pt-BR");
}

function imprimirRelatorio(html){
  const area = document.getElementById("print-area");
  area.innerHTML = html;
  window.print();
}

function exportarRelatorioAmbiente(obra, pav, amb, unid){
  let html = `
    <div class="rel-header">
      <h1>Ficha de Vistoria — ${escapeHtml(obra.nome)}</h1>
      <div class="meta">Pavimento: ${escapeHtml(pav.nome)}${unid?` · Unidade: ${escapeHtml(unid.nome)}`:""} · Ambiente: ${escapeHtml(amb.nome)}<br>Gerado em: ${dataHoraAtual()}</div>
    </div>`;

  amb.fvsList.forEach(fvsInst=>{
    html += `<div class="rel-fvs-bloco">
      <h2>${escapeHtml(fvsInst.codigo)} / ${escapeHtml(fvsInst.nome)} — Rev.: ${escapeHtml(fvsInst.rev)}</h2>
      <div class="rel-normas"><b>Normas de referência:</b> ${fvsInst.normas.map(escapeHtml).join(" · ")}</div>`;
    fvsInst.itens.forEach((item, idx)=>{
      const st = item.status || "pend";
      html += `<div class="rel-item">
        ${idx+1}. ${escapeHtml(item.texto)}
        <span class="rel-status ${st}">${STATUS_LABEL[st]}</span>
        ${item.obs? `<div class="rel-obs"><b>Obs.:</b> ${escapeHtml(item.obs)}</div>` : ""}
        ${item.foto? `<img class="rel-foto" src="${item.foto}">` : ""}
      </div>`;
    });
    html += `</div>`;
  });

  html += `<div class="meta" style="margin-top:30px;">Responsável técnico: _______________________________ &nbsp;&nbsp; Data: ___/___/______</div>`;
  imprimirRelatorio(html);
}

function exportarRelatorioObra(obra){
  const totalItens = todosAmbientesDaObra(obra).flatMap(a=>a.fvsList).flatMap(f=>f.itens);
  const prog = calcProgresso(totalItens);
  const nc = totalItens.filter(i=>i.status==="nc").length;
  const okC = totalItens.filter(i=>i.status==="ok").length;
  const pendC = totalItens.filter(i=>!i.status || i.status==="pend").length;

  let html = `
    <div class="rel-header">
      <h1>Relatório de Progresso — ${escapeHtml(obra.nome)}</h1>
      <div class="meta">${obra.endereco? escapeHtml(obra.endereco)+"<br>":""}Gerado em: ${dataHoraAtual()}</div>
    </div>
    <div class="rel-resumo-cards">
      <div><span class="n">${okC}</span>Conformes</div>
      <div><span class="n">${nc}</span>Não conf.</div>
      <div><span class="n">${pendC}</span>Pendentes</div>
      <div><span class="n">${prog}%</span>Progresso geral</div>
    </div>
    <table class="rel-table">
      <tr><th>Pavimento</th><th>Unidade</th><th>Ambiente</th><th>Serviços (FVS)</th><th>Progresso</th><th>Não conf.</th></tr>`;

  obra.pavimentos.forEach(pav=>{
    if(!pav.unidades) pav.unidades = [];
    const linhas = pav.ambientes.map(amb=>({unidade:"—", amb}))
      .concat(pav.unidades.flatMap(unid=>unid.ambientes.map(amb=>({unidade:unid.nome, amb}))));
    if(!linhas.length){
      html += `<tr><td>${escapeHtml(pav.nome)}</td><td colspan="5">Nenhum ambiente cadastrado</td></tr>`;
      return;
    }
    linhas.forEach(({unidade, amb})=>{
      const p = calcProgressoFvsList(amb.fvsList);
      const ncA = contarNC(amb.fvsList);
      html += `<tr>
        <td>${escapeHtml(pav.nome)}</td>
        <td>${escapeHtml(unidade)}</td>
        <td>${escapeHtml(amb.nome)}</td>
        <td>${amb.fvsList.map(f=>escapeHtml(f.codigo)).join(", ") || "—"}</td>
        <td>${p}%</td>
        <td>${ncA || "—"}</td>
      </tr>`;
    });
  });

  html += `</table>`;

  const itensNC = [];
  obra.pavimentos.forEach(pav=>todosAmbientesDoPavimento(pav).forEach(amb=>amb.fvsList.forEach(fvsInst=>{
    fvsInst.itens.forEach((item,idx)=>{
      if(itemPrecisaReinspecao(item)) itensNC.push({pav:pav.nome, amb:amb.nome, fvs:fvsInst.codigo, texto:item.texto, obs:item.obs, status:item.status, idx});
    });
  })));
  if(itensNC.length){
    html += `<h2 style="font-size:15px;margin-top:20px;">Não conformidades e reinspeções pendentes</h2>`;
    itensNC.forEach(it=>{
      html += `<div class="rel-item">
        <b>${escapeHtml(it.pav)} · ${escapeHtml(it.amb)} · ${escapeHtml(it.fvs)}</b>
        <span class="rel-status ${it.status}">${STATUS_LABEL[it.status]}</span><br>
        ${it.idx+1}. ${escapeHtml(it.texto)}
        ${it.obs? `<div class="rel-obs"><b>Obs.:</b> ${escapeHtml(it.obs)}</div>` : ""}
      </div>`;
    });
  }

  imprimirRelatorio(html);
}

function exportarRelatorioFornecedor(obra, forn, itensNC){
  let html = `
    <div class="rel-header">
      <h1>Relatório de Não Conformidades — ${escapeHtml(forn.nome)}</h1>
      <div class="meta">Obra: ${escapeHtml(obra.nome)}${forn.telefone?` · Tel.: ${escapeHtml(forn.telefone)}`:""}<br>Gerado em: ${dataHoraAtual()}</div>
    </div>`;

  itensNC.forEach(t=>{
    html += `<div class="rel-item">
      <b>${escapeHtml(t.pav.nome)}${t.unid?` · ${escapeHtml(t.unid.nome)}`:""} · ${escapeHtml(t.amb.nome)} · ${escapeHtml(t.fvsInst.codigo)} / ${escapeHtml(t.fvsInst.nome)}</b>
      <span class="rel-status ${t.item.status}">${STATUS_LABEL[t.item.status]}</span><br>
      ${t.idx+1}. ${escapeHtml(t.item.texto)}
      ${t.item.obs? `<div class="rel-obs"><b>Obs.:</b> ${escapeHtml(t.item.obs)}</div>` : ""}
      ${t.item.foto? `<img class="rel-foto" src="${t.item.foto}">` : ""}
    </div>`;
  });

  html += `<div class="meta" style="margin-top:30px;">Ciente do responsável: _______________________________ &nbsp;&nbsp; Data: ___/___/______</div>`;
  imprimirRelatorio(html);
}

function escapeHtml(str){
  if(str==null) return "";
  return String(str).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

render();
